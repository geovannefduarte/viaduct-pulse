[versions]
embedded-postgres = "2.2.2"
embedded-postgres-binaries = "18.6.0"
htmx = "2.0.11"
htmx-spring-boot = "5.2.0"
kotlin = "2.2.21"
ktlint = "1.8.0"
shadleaf = "0.7.0"
spotless = "8.10.3"
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"

[libraries]
embedded-postgres = { module = "io.zonky.test:embedded-postgres", version.ref = "embedded-postgres" }
embedded-postgres-binaries-bom = { module = "io.zonky.test.postgres:embedded-postgres-binaries-bom", version.ref = "embedded-postgres-binaries" }
embedded-postgres-binaries-darwin-arm64v8 = { module = "io.zonky.test.postgres:embedded-postgres-binaries-darwin-arm64v8" }
embedded-postgres-binaries-linux-arm64v8 = { module = "io.zonky.test.postgres:embedded-postgres-binaries-linux-arm64v8" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
htmlunit = { module = "org.htmlunit:htmlunit" }
htmx-spring-boot-thymeleaf = { module = "io.github.wimdeblauwe:htmx-spring-boot-thymeleaf", version.ref = "htmx-spring-boot" }
htmx-webjar = { module = "org.webjars.npm:htmx.org", version.ref = "htmx" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
shadleaf = { module = "io.github.wimdeblauwe:shadleaf-spring-boot-starter", version.ref = "shadleaf" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-thymeleaf = { module = "org.springframework.boot:spring-boot-starter-thymeleaf" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
webjars-locator-lite = { module = "org.webjars:webjars-locator-lite" }

kotlin-allopen-plugin = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-dependency-management-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }
